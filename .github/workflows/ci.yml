name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No PORTFOLIO_DATA_URL: the build runs against the placeholder in
      # data.config.example.ts. That keeps the check working on forks, where
      # secrets are unavailable, and it is the code we are validating here —
      # deploy.yml is what verifies the real content fetch.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint
        continue-on-error: true
